server {
    listen 80;
    server_name localhost;

    location / {
        return 301 /wa-bot/;
    }

    location /wa-bot/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /wa-bot/index.html;
    }

    location /api/ {
        proxy_pass http://backend:5005/api/;
        proxy_set_header Host $host;
    }
    
    # Menangkap API yang mengarah ke /wa-bot/api
    location /wa-bot/api/ {
        proxy_pass http://backend:5005/api/;
        proxy_set_header Host $host;
    }
}
